name: Daily Last.fm Update

on:
  schedule:
    - cron: '0 3 * * *'   # 3 AM UTC — yesterday's scrobbles are fully recorded
  workflow_dispatch:        # allow manual runs from the GitHub UI

permissions:
  contents: write           # needed to push the updated data and plots back

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: uv run python -m unittest discover -s tests

      # The first run (no data/ folder yet) downloads both full histories, ~2-4 minutes.
      - name: Fetch new scrobbles and rebuild the page
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          MY_USER: Lib0n
          FRIEND_USER: dymovaleksandra
          MY_NAME: Tsimur
          FRIEND_NAME: Sasha
          MPLBACKEND: Agg   # headless matplotlib — no display needed
        run: uv run python update_data.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data index.html season2_chart.png
          git diff --staged --quiet || \
            git commit -m "chore: daily data update $(date -u +%Y-%m-%d)" && \
            git push
